<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="電車買幫手，陪你一步一步找到適合自己的電動車。"
    />
    <meta name="theme-color" content="#f7f8f4" />
    <title>電車買幫手 — 找到適合你的電動車</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主選單">
        <a class="brand" href="#" aria-label="電車買幫手首頁">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M18.2 3.5 8.7 17h6.5l-1.4 11.5L23.3 15h-6.5l1.4-11.5Z"
                fill="currentColor"
              />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>電車買幫手</strong>
            <span>你的電動車小夥伴</span>
          </span>
        </a>

        <button class="new-chat" type="button">
          <span aria-hidden="true">＋</span>
          開始新對話
        </button>

        <div class="side-section">
          <p class="side-label">探索主題</p>
          <a class="side-link active" href="#ask">
            <span class="side-icon" aria-hidden="true">✳</span>
            買車怎麼開始
          </a>
          <a class="side-link" href="#prompts">
            <span class="side-icon" aria-hidden="true">⌁</span>
            電車大小事
          </a>
          <a class="side-link" href="#prompts">
            <span class="side-icon" aria-hidden="true">↗</span>
            充電與續航
          </a>
          <a class="side-link" href="#prompts">
            <span class="side-icon" aria-hidden="true">＄</span>
            預算與補助
          </a>
        </div>

        <div class="sidebar-bottom">
          <div class="tip-card">
            <span class="tip-spark" aria-hidden="true">✦</span>
            <p class="tip-title">第一次看電車？</p>
            <p class="tip-copy">從你的日常出發，不用先做功課也沒關係。</p>
            <a href="#ask">看看入門指南 <span aria-hidden="true">→</span></a>
          </div>
          <button class="profile" type="button" aria-label="使用者設定">
            <span class="avatar">你</span>
            <span class="profile-copy">
              <strong>電車新手</strong>
              <span>慢慢找到你的答案</span>
            </span>
            <span class="profile-more" aria-hidden="true">···</span>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-brand" type="button" aria-label="電車買幫手">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path
                  d="M18.2 3.5 8.7 17h6.5l-1.4 11.5L23.3 15h-6.5l1.4-11.5Z"
                  fill="currentColor"
                />
              </svg>
            </span>
            <strong>電車買幫手</strong>
          </button>
          <div class="breadcrumb"><span>我的小幫手</span><span aria-hidden="true">/</span><strong>新對話</strong></div>
          <button class="help-button" type="button">
            <span class="help-icon" aria-hidden="true">?</span>
            使用小提醒
          </button>
        </header>

        <section class="conversation" id="ask" aria-labelledby="welcome-title">
          <div class="welcome">
            <div class="welcome-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path
                  d="M18.2 3.5 8.7 17h6.5l-1.4 11.5L23.3 15h-6.5l1.4-11.5Z"
                  fill="currentColor"
                />
              </svg>
            </div>
            <div class="welcome-eyebrow"><span></span> 陪你一起，輕鬆認識電動車</div>
            <h1 id="welcome-title">嗨，準備好找到<br class="mobile-break" />你的第一台電車了嗎？</h1>
            <p class="welcome-copy">
              不管你正好奇充電、續航，還是該怎麼挑車，<br class="desktop-break" />
              都可以從一個小問題開始。沒有笨問題，慢慢聊就好。
            </p>
          </div>

          <div class="prompt-area" id="prompts">
            <div class="prompt-heading">
              <span>不知道從哪裡開始？</span>
              <span class="prompt-subtitle">試試看這些問題</span>
            </div>
            <div class="prompt-grid">
              <button class="prompt-card" type="button">
                <span class="prompt-icon mint" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M4 13.5 12 5l8 8.5M6.5 11v8h11v-8M10 19v-5h4v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="prompt-text"><strong>我適合買電動車嗎？</strong><span>先從我的日常用車聊起</span></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="prompt-card" type="button">
                <span class="prompt-icon peach" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 15.5h12l1.4 2.1v1.9H4.6v-1.9L6 15.5ZM5 15l1.5-5h11l1.5 5M8 10l1-3h6l1 3M7.5 17.7h.01M16.5 17.7h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="prompt-text"><strong>電車大概要準備多少預算？</strong><span>一起盤點買車的花費</span></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="prompt-card" type="button">
                <span class="prompt-icon sky" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M13.5 2.8 6 13h5l-.5 8.2L18 11h-5l.5-8.2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="prompt-text"><strong>家裡沒有充電樁怎麼辦？</strong><span>聊聊充電方式與生活圈</span></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="prompt-card" type="button">
                <span class="prompt-icon lilac" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 18.5V12M9.5 18.5V6M14.5 18.5v-9M19.5 18.5v-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 19h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </span>
                <span class="prompt-text"><strong>電動車跟油車，養車差多少？</strong><span>看看長期用車成本差異</span></span>
                <span class="prompt-arrow" aria-hidden="true">↗</span>
              </button>
            </div>
          </div>

          <a
            class="map-link"
            href="https://www.google.com/maps/d/u/0/viewer?mid=19OGC8E8JMvUgHOEJkpkBUXnqiYgfwEcZ&amp;ll=23.71715317641448%2C120.886376184375&amp;z=6"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="在新分頁開啟 CCS1 充電站地圖"
          >
            <span class="map-pin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M19 10.2c0 5-7 10.3-7 10.3S5 15.2 5 10.2a7 7 0 1 1 14 0Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <span class="map-link-copy">
              <strong>查看 CCS1 充電站地圖</strong>
              <span>在 Google 地圖上探索充電站</span>
            </span>
            <span class="map-link-arrow" aria-hidden="true">↗</span>
          </a>

          <div class="composer-wrap">
            <div class="composer" role="group" aria-label="輸入問題">
              <button class="attach-button" type="button" aria-label="附加內容">＋</button>
              <label class="visually-hidden" for="question">輸入你想了解的電車問題</label>
              <input id="question" type="text" placeholder="輸入你想了解的電車問題…" />
              <span class="composer-hint">Enter ↵</span>
              <button class="send-button" type="button" aria-label="送出問題">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <p class="disclaimer">電車買幫手提供一般資訊，實際車款與補助請以官方資料為準。</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
