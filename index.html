<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="用聊天式導覽認識電動車、TOYOTA bZ4X、充電方式與選車考量。"
    />
    <meta name="theme-color" content="#f7f8f4" />
    <title>電車選購助手</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <button class="sidebar-backdrop" type="button" aria-label="關閉選單" tabindex="-1"></button>
      <aside class="sidebar" id="sidebar" aria-label="聊天主選單">
        <a class="brand" href="#" aria-label="電車選購助手首頁">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M7 18.5h18l-1.7-6.2a2 2 0 0 0-1.9-1.4H10.6a2 2 0 0 0-1.9 1.4L7 18.5Zm0 0v3h3m15-3v3h-3M10 21.5h12M10 15h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19.5" r="1.3" fill="currentColor"/><circle cx="22" cy="19.5" r="1.3" fill="currentColor"/>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>電車選購助手</strong>
            <span>陪你找到適合的電車</span>
          </span>
        </a>

        <button class="new-chat" id="new-chat" type="button">
          <span aria-hidden="true">＋</span>
          開始新對話
        </button>

        <nav class="side-section" aria-label="常見選購主題">
          <p class="side-label">快速選單</p>
          <button class="side-link" type="button" data-message="想了解 TOYOTA bZ4X">
            <span class="side-icon" aria-hidden="true">◇</span>
            認識 bZ4X
          </button>
          <button class="side-link" type="button" data-message="我想了解電動車充電與續航">
            <span class="side-icon" aria-hidden="true">ϟ</span>
            充電與續航
          </button>
          <button class="side-link" type="button" data-message="我想開始選車診斷">
            <span class="side-icon" aria-hidden="true">☷</span>
            開始選車診斷
          </button>
          <a
            class="side-link"
            href="https://www.google.com/maps/d/u/0/viewer?mid=19OGC8E8JMvUgHOEJkpkBUXnqiYgfwEcZ&amp;ll=23.71715317641448%2C120.886376184375&amp;z=6"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="side-icon" aria-hidden="true">⌖</span>
            CCS1 充電地圖
            <span class="external-icon" aria-hidden="true">↗</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="tip-card">
            <span class="tip-spark" aria-hidden="true">✳</span>
            <p class="tip-title">從你的生活開始</p>
            <p class="tip-copy">通勤距離、停車條件與充電習慣，都是選車的重要線索。</p>
          </div>
          <p class="sidebar-note">電動車選購・實用資訊整理</p>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="開啟主選單"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <span></span><span></span><span></span>
          </button>
          <div class="chat-title">
            <span class="assistant-avatar small-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 13.5 12 5l8 8.5M6.5 11v8h11v-8M10 19v-5h4v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>
              <strong>電車選購助手</strong>
              <span class="status"><i aria-hidden="true"></i> 資訊導覽中</span>
            </span>
          </div>
          <a
            class="header-map-link"
            href="https://www.google.com/maps/d/u/0/viewer?mid=19OGC8E8JMvUgHOEJkpkBUXnqiYgfwEcZ&amp;ll=23.71715317641448%2C120.886376184375&amp;z=6"
            target="_blank"
            rel="noopener noreferrer"
          >充電地圖 <span aria-hidden="true">↗</span></a>
        </header>

        <section class="chat-panel" aria-label="電車選購對話">
          <div class="chat-feed" id="chat-feed" role="log" aria-live="polite" aria-relevant="additions">
            <div class="day-divider"><span>今天</span></div>
            <article class="message assistant-message">
              <span class="assistant-avatar message-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4 13.5 12 5l8 8.5M6.5 11v8h11v-8M10 19v-5h4v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <div class="message-content">
                <span class="speaker-name">電車選購助手</span>
                <div class="bubble">
                  <p>嗨！我可以陪你了解電動車與 TOYOTA bZ4X，也能一起整理適合你的選車條件。你現在最想先知道什麼？</p>
                  <div class="suggestion-list" aria-label="建議問題">
                    <button class="suggestion" type="button" data-message="想了解 TOYOTA bZ4X">認識 bZ4X</button>
                    <button class="suggestion" type="button" data-message="我想了解電動車充電與續航">充電與續航</button>
                    <button class="suggestion" type="button" data-message="我想開始選車診斷">幫我挑選適合的電車</button>
                    <button class="suggestion" type="button" data-message="我想查看 CCS1 充電站地圖">找附近充電站</button>
                  </div>
                </div>
                <time class="message-time">現在</time>
              </div>
            </article>
          </div>

          <form class="composer-wrap" id="chat-form">
            <label class="visually-hidden" for="question">輸入你的選車問題</label>
            <div class="composer">
              <input
                id="question"
                name="question"
                type="text"
                autocomplete="off"
                placeholder="輸入問題，例如：沒有家用充電樁適合買電動車嗎？"
                required
              />
              <button class="send-button" type="submit" aria-label="送出訊息">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <p class="disclaimer">此頁為靜態資訊導覽原型，回答由預設內容提供，尚未串接 AI。車款規格、售價與補助請以官方公告為準。</p>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
